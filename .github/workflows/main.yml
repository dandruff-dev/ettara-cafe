name: Torrent Bridge
on:
  repository_dispatch:
    types: [leech]
jobs:
  heist:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          curl -LsSf https://hf.co/cli/install.sh | bash

      - name: Download (The Speed Run)
        run: |
          mkdir -p data
          aria2c \
            --seed-time=0 \
            -x 16 -s 16 -j 16 \
            --min-split-size=10M \
            --summary-interval=0 \
            --dir=./data \
            "${{ github.event.client_payload.magnet }}"

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload ${{ github.event.client_payload.repo }} ./data . --repo-type dataset
